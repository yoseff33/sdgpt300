<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ضمانك، سوق سعودي بمعاملات ضمان مالي">
  <title>ضمانك | السوق الآمن</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-header></div>
  <main>
    <section class="hero">
      <div>
        <span class="tag">بيع واشترِ بثقة</span>
        <h1>حقك محفوظ، وصفقتك مضمونة.</h1>
        <p>لا يصل المبلغ للبائع حتى تستلم وتفحص. سوق مفتوح وحماية مالية في مكان واحد.</p>
        <a class="button alt" href="#market">تصفح السوق</a>
        <a class="button" href="how-it-works.html">كيف تعمل؟</a>
      </div>
      <div class="hero-art">🛡️</div>
    </section>
    <section id="market" class="container">
      <h2>اكتشف السوق</h2>
      <form id="filters" class="filters">
        <input name="q" placeholder="ابحث عن منتج">
        <select name="category">
          <option value="">كل الفئات</option>
          <option>إلكترونيات</option>
          <option>سيارات</option>
          <option>أثاث</option>
          <option>خدمات</option>
        </select>
        <input name="max" type="number" placeholder="أعلى سعر">
        <button>بحث</button>
      </form>
      <div id="products" class="grid"><p>جارٍ التحميل…</p></div>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
