<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدخول | ضمانك</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div data-header></div>
  <main class="container">
    <form id="auth" class="form card">
      <h1>أهلًا بك</h1>
      <label>العملية
        <select name="mode">
          <option value="login">تسجيل الدخول</option>
          <option value="signup">إنشاء حساب</option>
        </select>
      </label>
      <label>الاسم<input name="full_name" autocomplete="name"></label>
      <label>الجوال<input name="phone" autocomplete="tel"></label>
      <label>البريد<input name="email" type="email" required autocomplete="email"></label>
      <label>كلمة المرور<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <button>متابعة بأمان</button>
      <p id="msg" class="message"></p>
    </form>
  </main>
  <div data-footer></div>
  <script type="module" src="/assets/js/app.js"></script>
  <script type="module">
    import { api } from '/assets/js/api.js';
    const form = document.getElementById('auth');
    const msg = document.getElementById('msg');
    form.onsubmit = async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const endpoint = data.mode === 'signup' ? '/auth/register' : '/auth/login';
        const res = await api(endpoint, { method: 'POST', body: JSON.stringify(data) });
        if (res.token) {
          localStorage.setItem('damanak_token', res.token);
          window.location.href = '/dashboard.html';
        } else {
          msg.textContent = 'تم بنجاح، لكن الرمز غير موجود';
        }
      } catch (err) {
        msg.textContent = err.message;
      }
    };
  </script>
</body>
</html>
