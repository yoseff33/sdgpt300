<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدخول | ضمانك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="inner-page">
  <div data-header></div>
  <main class="container page-main">
    <section class="auth-shell"><div class="auth-intro"><span class="eyebrow">دخول آمن وواضح</span><h1>أهلًا بك في ضمانك</h1><p>ادخل حسابك وتابع صفقاتك، أو أنشئ حساب جديد بخطوات بسيطة.</p></div><form id="auth" class="form card auth-card">
      <h1>أهلًا بك</h1>
      <label>العملية
        <select name="mode">
          <option value="login">تسجيل الدخول</option>
          <option value="signup">إنشاء حساب</option>
        </select>
      </label>
      <label>الاسم<input name="full_name" autocomplete="name"></label>
      <label>الجوال<input name="phone" autocomplete="tel"></label>
      <label>البريد<input name="email" type="email" required autocomplete="email"></label>
      <label>كلمة المرور<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <button>متابعة بأمان</button>
      <p id="msg" class="message"></p>
    </form></section>
  </main>
  <div data-footer></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
