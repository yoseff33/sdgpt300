<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة | ضمانك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>.admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}.admin-stat{padding:1.2rem}.admin-stat small{display:block;color:#64748b}.admin-stat strong{font-size:1.5rem}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:.75rem;border-bottom:1px solid #e5e7eb;text-align:right}.admin-section{margin-top:1.25rem;overflow:auto}@media(max-width:800px){.admin-grid{grid-template-columns:repeat(2,1fr)}}</style>
</head>
<body class="inner-page"><div data-header></div><main class="container page-main"><div class="section-heading"><span class="eyebrow">غرفة العمليات</span><h1>لوحة إدارة ضمانك</h1></div><p id="adminMessage">جارٍ التحقق من صلاحيتك…</p><section id="adminContent" hidden><div class="admin-grid"><div class="card admin-stat"><small>المستخدمون</small><strong id="usersCount">0</strong></div><div class="card admin-stat"><small>الإعلانات</small><strong id="productsCount">0</strong></div><div class="card admin-stat"><small>الصفقات</small><strong id="transactionsCount">0</strong></div><div class="card admin-stat"><small>نزاعات مفتوحة</small><strong id="disputesCount">0</strong></div><div class="card admin-stat"><small>أموال محتجزة</small><strong id="heldAmount">0</strong></div><div class="card admin-stat"><small>العمولات المحققة</small><strong id="commissions">0</strong></div><div class="card admin-stat"><small>تنبيهات الاحتيال</small><strong id="alertsCount">0</strong></div></div><section class="card admin-section"><h2>المستخدمون</h2><div id="usersTable"></div></section><section class="card admin-section"><h2>أحدث الصفقات</h2><div id="transactionsTable"></div></section></section></main><div data-footer></div><script type="module" src="assets/js/app.js"></script><script type="module">
import{api,money,token}from'./assets/js/api.js';if(!token())location.href='login.html';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const[stats,users,transactions]=await Promise.all([api('/admin/overview'),api('/admin/users'),api('/admin/transactions')]);$('#adminMessage').textContent='';$('#adminContent').hidden=false;$('#usersCount').textContent=stats.users;$('#productsCount').textContent=stats.products;$('#transactionsCount').textContent=stats.transactions;$('#disputesCount').textContent=stats.open_disputes;$('#heldAmount').textContent=money(stats.held_amount);$('#commissions').textContent=money(stats.commissions);$('#alertsCount').textContent=stats.fraud_alerts;$('#usersTable').innerHTML=`<table class="admin-table"><thead><tr><th>الاسم</th><th>الجوال</th><th>الدور</th><th>التوثيق</th></tr></thead><tbody>${users.map(x=>`<tr><td>${esc(x.full_name||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.role||'user')}</td><td>${x.nafath_verified?'موثق':'غير موثق'}</td></tr>`).join('')}</tbody></table>`;$('#transactionsTable').innerHTML=`<table class="admin-table"><thead><tr><th>المنتج</th><th>المشتري</th><th>البائع</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${transactions.slice(0,50).map(x=>`<tr><td>${esc(x.product?.title||x.description||'-')}</td><td>${esc(x.buyer?.full_name||'-')}</td><td>${esc(x.seller?.full_name||'-')}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`;}catch(error){$('#adminMessage').textContent=error.status===403?'ما عندك صلاحية دخول لوحة الإدارة':error.message;}
</script></body></html>
