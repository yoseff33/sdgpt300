
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة | ضمانك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}.stat{padding:1.15rem}.stat small{display:block;color:#64748b}.stat strong{font-size:1.45rem}.tabs{display:flex;gap:.5rem;overflow:auto;margin:1.2rem 0}.tabs button{white-space:nowrap;border:1px solid #d8e2dc;background:#fff;padding:.75rem 1rem;border-radius:999px;cursor:pointer;font-weight:700}.tabs button.active{background:#006c35;color:#fff}.tab{display:none}.tab.active{display:block}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{padding:.7rem;border-bottom:1px solid #e5e7eb;text-align:right;vertical-align:middle}.actions{display:flex;gap:.35rem;flex-wrap:wrap}.mini{border:0;border-radius:.5rem;padding:.45rem .65rem;cursor:pointer;font-weight:700;background:#e7f2ec;color:#005c2d}.danger{background:#fee2e2;color:#991b1b}.warning{background:#fff0c2;color:#795900}.risk{font-weight:800}.risk-high,.risk-critical{color:#b91c1c}.risk-medium{color:#a16207}.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.filters input,.filters select{padding:.7rem;border:1px solid #cbd5e1;border-radius:.7rem}.message{position:sticky;top:.5rem;z-index:5;padding:.7rem;border-radius:.6rem}.message:not(:empty){background:#ecfdf3;color:#006c35}@media(max-width:800px){.admin-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body class="inner-page"><div data-header></div><main class="container page-main"><div class="section-heading"><span class="eyebrow">غرفة العمليات</span><h1>لوحة إدارة ضمانك</h1></div><p id="message" class="message">جارٍ التحقق من صلاحيتك…</p><section id="content" hidden>
  <div class="admin-grid" id="stats"></div>
  <nav class="tabs"><button class="active" data-tab="users">المستخدمون والمخاطر</button><button data-tab="products">الإعلانات</button><button data-tab="transactions">الصفقات والتقارير</button><button data-tab="alerts">تنبيهات الاحتيال</button><button data-tab="audit">سجل الإدارة</button></nav>
  <section class="tab active card" id="users"><div class="section-heading"><h2>إدارة المستخدمين</h2></div><div class="filters"><input id="userSearch" placeholder="بحث بالاسم أو الجوال"><select id="statusFilter"><option value="">كل الحالات</option><option value="active">نشط</option><option value="suspended">معلق</option><option value="banned">محظور</option></select><select id="riskFilter"><option value="">كل المخاطر</option><option value="low">منخفض</option><option value="medium">متوسط</option><option value="high">مرتفع</option><option value="critical">حرج</option></select><button class="mini" id="refreshUsers">تحديث</button></div><div class="table-wrap" id="usersTable"></div></section>
  <section class="tab card" id="products"><div class="section-heading"><h2>إدارة الإعلانات</h2></div><div class="table-wrap" id="productsTable"></div></section>
  <section class="tab card" id="transactions"><div class="section-heading"><h2>تقرير الصفقات</h2></div><div class="table-wrap" id="transactionsTable"></div></section>
  <section class="tab card" id="alerts"><div class="section-heading"><h2>تنبيهات الاحتيال</h2></div><div class="table-wrap" id="alertsTable"></div></section>
  <section class="tab card" id="audit"><div class="section-heading"><h2>سجل إجراءات الأدمن</h2></div><div class="table-wrap" id="auditTable"></div></section>
</section></main><div data-footer></div><script type="module" src="assets/js/app.js"></script><script type="module">
import{api,money,token}from'./assets/js/api.js';
if(!token())location.href='login.html';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=(text,error=false)=>{const m=$('#message');m.textContent=text;m.style.color=error?'#991b1b':'';};
let users=[];
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===button.dataset.tab));});
const labels={active:'نشط',suspended:'معلق',banned:'محظور',low:'منخفض',medium:'متوسط',high:'مرتفع',critical:'حرج',approved:'معتمد',rejected:'مرفوض',pending:'تحت المراجعة'};
async function request(path,options){try{const result=await api(path,options);say('تم تنفيذ الإجراء بنجاح');return result}catch(error){say(error.message,true);throw error}}
function renderStats(s){$('#stats').innerHTML=[['المستخدمون',s.users],['نشطون',s.active_users],['محظور/معلق',s.blocked_users],['خطورة مرتفعة',s.high_risk_users],['الإعلانات',s.products],['الصفقات',s.transactions],['أموال محتجزة',money(s.held_amount)],['العمولات',money(s.commissions)],['حجم المبيعات',money(s.sales_volume)],['نزاعات مفتوحة',s.open_disputes],['تنبيهات احتيال',s.fraud_alerts]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
async function loadUsers(){const params=new URLSearchParams();if($('#userSearch').value)params.set('q',$('#userSearch').value);if($('#statusFilter').value)params.set('status',$('#statusFilter').value);if($('#riskFilter').value)params.set('risk',$('#riskFilter').value);users=await api(`/admin/users?${params}`);$('#usersTable').innerHTML=`<table class="admin-table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>التوثيق</th><th>الخطورة</th><th>الإجراءات</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.full_name||'-')}</b><br><small>${esc(u.phone||u.id)}</small></td><td>${esc(u.role||'user')}</td><td>${esc(labels[u.account_status]||u.account_status||'نشط')}</td><td>${u.nafath_verified?'موثق ✓':'غير موثق'}</td><td class="risk risk-${esc(u.risk_level)}">${u.risk_score||0}% · ${esc(labels[u.risk_level]||u.risk_level)}</td><td><div class="actions"><button class="mini" data-action="risk" data-id="${u.id}">احسب الخطر</button><button class="mini" data-action="role" data-id="${u.id}">الدور</button><button class="mini" data-action="verify" data-id="${u.id}">${u.nafath_verified?'إلغاء التوثيق':'توثيق'}</button><button class="mini warning" data-action="suspend" data-id="${u.id}">تعليق</button><button class="mini danger" data-action="ban" data-id="${u.id}">حظر</button><button class="mini" data-action="activate" data-id="${u.id}">تفعيل</button><button class="mini danger" data-action="delete" data-id="${u.id}">حذف</button></div></td></tr>`).join('')}</tbody></table>`;}
$('#usersTable').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const u=users.find(x=>x.id===b.dataset.id);if(!u)return;try{if(b.dataset.action==='risk')await request(`/admin/users/${u.id}/recalculate-risk`,{method:'POST'});if(b.dataset.action==='verify')await request(`/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({nafath_verified:!u.nafath_verified})});if(b.dataset.action==='role'){const role=prompt('اكتب الدور: user أو support أو manager أو admin',u.role||'user');if(!role)return;await request(`/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({role})});}if(b.dataset.action==='suspend'){const reason=prompt('سبب التعليق');if(!reason)return;const days=Number(prompt('مدة التعليق بالأيام','7')||7);await request(`/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({account_status:'suspended',suspension_reason:reason,suspended_until:new Date(Date.now()+days*86400000).toISOString()})});}if(b.dataset.action==='ban'){const reason=prompt('سبب الحظر الدائم');if(!reason||!confirm(`تأكيد حظر ${u.full_name||'المستخدم'}؟`))return;await request(`/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({account_status:'banned',suspension_reason:reason})});}if(b.dataset.action==='activate')await request(`/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({account_status:'active'})});if(b.dataset.action==='delete'){const email=prompt('الحذف نهائي. اكتب بريد المستخدم للتأكيد');if(!email||!confirm('متأكد من الحذف النهائي؟'))return;await request(`/admin/users/${u.id}`,{method:'DELETE',body:JSON.stringify({confirm_email:email})});}await Promise.all([loadUsers(),loadOverview(),loadAudit()]);}catch{}};
async function loadProducts(){const rows=await api('/admin/products');$('#productsTable').innerHTML=`<table class="admin-table"><thead><tr><th>الإعلان</th><th>البائع</th><th>السعر</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${rows.map(p=>`<tr><td><a href="product.html?id=${p.id}">${esc(p.title)}</a></td><td>${esc(p.seller?.full_name||'-')}<br><small>خطر: ${esc(labels[p.seller?.risk_level]||p.seller?.risk_level||'-')}</small></td><td>${money(p.price)}</td><td>${esc(labels[p.moderation_status]||p.moderation_status)}</td><td><div class="actions"><button class="mini" data-product="approved" data-id="${p.id}">اعتماد</button><button class="mini warning" data-product="suspended" data-id="${p.id}">تعليق</button><button class="mini danger" data-product="rejected" data-id="${p.id}">رفض</button><button class="mini danger" data-product="delete" data-id="${p.id}">حذف</button></div></td></tr>`).join('')}</tbody></table>`;}
$('#productsTable').onclick=async e=>{const b=e.target.closest('[data-product]');if(!b)return;try{if(b.dataset.product==='delete'){if(!confirm('حذف الإعلان نهائيًا؟'))return;await request(`/admin/products/${b.dataset.id}`,{method:'DELETE'});}else{const reason=b.dataset.product==='approved'?'':prompt('اكتب سبب الإجراء');if(b.dataset.product!=='approved'&&!reason)return;await request(`/admin/products/${b.dataset.id}/moderation`,{method:'PUT',body:JSON.stringify({moderation_status:b.dataset.product,reason})});}await Promise.all([loadProducts(),loadOverview(),loadAudit()]);}catch{}};
async function loadOverview(){renderStats(await api('/admin/overview'))}async function loadTransactions(){const rows=await api('/admin/transactions');$('#transactionsTable').innerHTML=`<table class="admin-table"><thead><tr><th>المنتج</th><th>المشتري</th><th>البائع</th><th>المبلغ</th><th>العمولة</th><th>الحالة</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.product?.title||x.description)}</td><td>${esc(x.buyer?.full_name||'-')}</td><td>${esc(x.seller?.full_name||'-')}</td><td>${money(x.amount)}</td><td>${money(x.commission)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`}async function loadAlerts(){const rows=await api('/admin/fraud-alerts');$('#alertsTable').innerHTML=`<table class="admin-table"><thead><tr><th>النوع</th><th>الرسالة</th><th>الصفقة</th><th>التاريخ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.message)}</td><td>${esc(x.transaction_id)}</td><td>${new Date(x.created_at).toLocaleString('ar-SA')}</td></tr>`).join('')}</tbody></table>`}async function loadAudit(){const rows=await api('/admin/audit-logs');$('#auditTable').innerHTML=`<table class="admin-table"><thead><tr><th>الأدمن</th><th>الإجراء</th><th>الهدف</th><th>التفاصيل</th><th>التاريخ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.admin?.full_name||x.admin_id)}</td><td>${esc(x.action)}</td><td>${esc(x.target_type)} · ${esc(x.target_id)}</td><td><small>${esc(JSON.stringify(x.details||{}))}</small></td><td>${new Date(x.created_at).toLocaleString('ar-SA')}</td></tr>`).join('')}</tbody></table>`}
$('#refreshUsers').onclick=loadUsers;let timer;$('#userSearch').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadUsers,350)};$('#statusFilter').onchange=loadUsers;$('#riskFilter').onchange=loadUsers;
try{await Promise.all([loadOverview(),loadUsers(),loadProducts(),loadTransactions(),loadAlerts(),loadAudit()]);$('#content').hidden=false;say('');}catch(error){say(error.status===403?'ما عندك صلاحية دخول لوحة الإدارة':error.message,true)}
</script></body></html>
