<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الرصيد | ضمانك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="inner-page">
  <div data-header></div>
  <main class="container page-main">
    <section class="card">
      <span>الرصيد المتاح</span>
      <h1 id="balance">—</h1>
      <p>طلبات السحب تتطلب تفعيل مزود التحويل البنكي والتحقق من الآيبان. لن تُقبل طلبات وهمية.</p>
      <button disabled>طلب سحب — قريبًا</button>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { api, money } from './assets/js/api.js';
    try {
      const data = await api('/account');
      document.querySelector('#balance').textContent = money(data.wallet_balance || 0);
    } catch(e) {
      document.querySelector('#balance').textContent = e.message;
    }
  </script>
</body>
</html>
