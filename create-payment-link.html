<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء رابط دفع | ضمانك</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #006c35; }
    .btn-submit { background: #006c35; color: #fff; border: none; padding: 0.9rem; font-size: 1.1rem; font-weight: 700; border-radius: 2rem; cursor: pointer; width: 100%; }
    .btn-submit:hover { background: #004d25; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    #resultLink { margin-top: 2rem; background: #f1f5f9; padding: 1rem; border-radius: 1rem; display: none; word-break: break-all; }
  </style>
</head>
<body>
  <div data-header></div>
  <main class="container" style="max-width: 500px; margin: 3rem auto;">
    <h2>🔗 إنشاء رابط دفع مباشر</h2>
    <p style="color: #64748b;">أنشئ رابطاً لمشاركته مع عميل لاستلام مبلغ محدد</p>
    
    <form id="paymentLinkForm">
      <div class="form-group">
        <label>المبلغ (ريال) *</label>
        <input type="number" id="amount" required min="1" step="0.01" placeholder="مثال: 500.00">
      </div>
      <div class="form-group">
        <label>الوصف *</label>
        <input type="text" id="description" required placeholder="مثال: ثمن هاتف آيفون">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">إنشاء الرابط</button>
    </form>
    <div id="resultLink">
      <p style="font-weight: 700;">✅ تم الإنشاء! الرابط الخاص بك:</p>
      <a id="generatedLink" href="#" target="_blank" style="color: #006c35;"></a>
      <button onclick="navigator.clipboard.writeText(document.getElementById('generatedLink').href)" style="margin-top: 0.5rem; background: #006c35; color:#fff; border:none; padding:0.5rem 1rem; border-radius:0.5rem; cursor:pointer;">نسخ الرابط</button>
    </div>
  </main>
  <div data-footer></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('YOUR_URL', 'YOUR_ANON_KEY');

    document.getElementById('paymentLinkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = document.getElementById('amount').value;
      const description = document.getElementById('description').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإنشاء...';

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          alert('يرجى تسجيل الدخول');
          return;
        }

        const res = await fetch('/api/payment-links', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ amount, description })
        });

        const result = await res.json();
        if (res.ok) {
          document.getElementById('resultLink').style.display = 'block';
          document.getElementById('generatedLink').href = result.payment_link;
          document.getElementById('generatedLink').textContent = result.payment_link;
        } else {
          alert(result.error || 'حدث خطأ');
        }
      } catch (error) {
        alert('حدث خطأ في الاتصال');
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إنشاء الرابط';
      }
    });
  </script>
</body>
</html>
