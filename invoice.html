<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة العملية | ضمانك</title><link rel="stylesheet" href="assets/css/style.css"><style>.invoice{max-width:820px;margin:2rem auto;padding:2rem}.invoice-head{display:flex;justify-content:space-between;gap:1rem;border-bottom:2px solid #006c35;padding-bottom:1rem}.invoice-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0}.invoice table{width:100%;border-collapse:collapse}.invoice td{padding:.8rem;border-bottom:1px solid #ddd}.total{font-size:1.25rem;font-weight:800}.print-actions{max-width:820px;margin:1rem auto;display:flex;gap:.5rem}@media print{[data-header],[data-footer],.print-actions{display:none!important}.invoice{box-shadow:none;margin:0;max-width:none}}@media(max-width:600px){.invoice-grid{grid-template-columns:1fr}}</style></head>
<body class="inner-page"><div data-header></div><div class="print-actions"><button class="button button--primary" onclick="window.print()">حفظ أو طباعة PDF</button><button class="button button--secondary" onclick="history.back()">رجوع</button></div><main id="invoice" class="card invoice">جارٍ تحميل الفاتورة…</main><div data-footer></div><script type="module" src="assets/js/app.js"></script><script type="module">
import{api,money,token}from'./assets/js/api.js';if(!token())location.href='login.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id'),box=document.querySelector('#invoice');
try{const data=await api(`/reports/invoices/${encodeURIComponent(id)}`),t=data.transaction;box.innerHTML=`<div class="invoice-head"><div><h1>فاتورة عملية ضمانك</h1><p>${esc(data.invoice_number)}</p></div><div><b>تاريخ الإصدار</b><br>${new Date(data.issued_at).toLocaleString('ar-SA')}</div></div><div class="invoice-grid"><div><h3>المشتري</h3><p>${esc(t.buyer?.full_name||'-')}<br>${esc(t.buyer?.city||'')}</p></div><div><h3>البائع</h3><p>${esc(t.seller?.store_name||t.seller?.full_name||'-')}<br>${esc(t.seller?.city||'')}</p></div></div><table><tr><td>المنتج</td><td>${esc(t.product?.title||t.description)}</td></tr><tr><td>سعر المنتج</td><td>${money(t.amount)}</td></tr><tr><td>عمولة الوساطة</td><td>${money(t.commission)}</td></tr><tr><td>ضريبة العمولة (15%)</td><td>${money(t.commission_vat)}</td></tr><tr class="total"><td>إجمالي دفع المشتري</td><td>${money(t.buyer_total||t.amount)}</td></tr><tr><td>صافي مستحق البائع</td><td>${money(t.seller_net)}</td></tr><tr><td>حالة العملية</td><td>${esc(t.status)}</td></tr></table><p><small>${esc(data.tax_note)}</small></p>`;}catch(error){box.innerHTML=`<h1>تعذر عرض الفاتورة</h1><p>${esc(error.message)}</p>`}
</script></body></html>
